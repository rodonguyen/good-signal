# Backtest master configuration (Good Signal)
#
# This config is intentionally separate from config/assets.yaml (live bot).

version: 1  # Config version (for future migrations)

engine:
  # fee_rate: Total round-trip fee rate on notional (entry + exit).
  #           Example: 0.0014 = 0.14% round trip (0.07% per side).
  #           Applied to all trades for PnL calculation.
  fee_rate: 0.0015

  # debug: Enable verbose logging (progress prints, strategy details).
  #        Set to false for cleaner output.
  debug: false

  cache:
    # enabled: Enable Parquet caching for resampled OHLCV data (e.g., 1m->1h).
    #          Speeds up subsequent runs. Set to false to always recompute.
    enabled: true
    
    # dir: Directory for cached Parquet files.
    dir: data/cache/backtest
    
    # version: Cache version string. Bump this to invalidate all cached artifacts
    #          after logic changes (e.g., resampling algorithm updates).
    version: v1

  # outputs: Output directory paths for backtest artifacts.
  outputs:
    # trades_dir: Directory for per-symbol trade CSVs.
    #             Files: {trades_dir}/{strategy_id}/{SYMBOL}_trades.csv
    trades_dir: data/trades
    
    # portfolio_dir: Directory for portfolio-level trade CSVs.
    #                Files: {portfolio_dir}/{strategy_id}/portfolio_trades.csv
    portfolio_dir: data/portfolio
    
    # reports_dir: Directory for HTML analysis reports.
    #               Files: {reports_dir}/{strategy_id}/portfolio_report.html
    reports_dir: outputs/reports

data:
  raw_1m_dir: data/raw/crypto

  download:
    enabled: false
    provider: bybit
    start_date: 2024-07-01
    end_date: 2026-01-31

  # Bybit API settings
  api:
    rate_limit_per_minute: 500
    request_delay_seconds: 0.3

universe:
  symbols:
    # ETHUSDT:
    #   category: linear
    BTCUSDT:
      category: linear
    # XAUTUSDT:
    #   category: linear
steps:
  # enabled_blocks: List of pipeline steps to execute (1-5).
  #                 1 = Data download (if download.enabled=true)
  #                 2 = Strategy execution (generate trades)
  #                 3 = Pre-entry filters
  #                 4 = Portfolio building (position sizing, equity curve)
  #                 5 = Analysis report generation
  #                 Example: [1, 2, 3, 4, 5] runs all steps.
  #                 Example: [1] downloads data only.
  enabled_blocks: [1,2,3,4,5]

  filters:
    # enabled: Enable pre-entry filter pipeline (filters trading days).
    enabled: false 
    
    # config_path: Path to filter rules configuration.
    config_path: config/backtest/filters.yaml

  portfolio:
    # enabled: Enable portfolio building step (combines trades, applies position sizing).
    enabled: true
    
    # config_path: Path to portfolio builder configuration.
    #              Defines position sizing method (risk-based, fixed-dollar, equal-weight).
    config_path: config/backtest/portfolio_config.yaml

  analysis:
    # enabled: Enable analysis report generation (HTML with charts and statistics).
    enabled: true
    
    # breakout_config_path: Path to breakout config (legacy, for display in report).
    #                       Actual values come from strategy params in this file.
    breakout_config_path: breakout/src/config/breakout_config.yaml

strategies:
  # List of strategies to backtest. Each strategy must have:
  # - id: Unique identifier (used in output paths)
  # - type: Strategy type (bb_trendline_rr4, atr_breakout)
  # - enabled: true/false to enable/disable this strategy
  
  # BBTrendline: Bollinger Bands trendline strategy
  #              Generates signals on 1h timeframe, executes on 1m bars.
  - id: bb_trendline_rr4
    type: bb_trendline_rr4
    enabled: false
    
    # signal_timeframe: Timeframe for signal generation (1h = hourly bars).
    signal_timeframe: 1h
    
    # execution_timeframe: Timeframe for trade execution (1m = minute bars).
    execution_timeframe: 1m
    
    indicator:
      # name: Indicator name (BollingerBands).
      name: BollingerBands
      params:
        # period: Moving average period for Bollinger Bands.
        period: 20
        
        # std_dev: Standard deviation multiplier for band width.
        std_dev: 2.0
    
    execution:
      # entry_fill: Entry fill method (next_1m_open = enter at next 1m candle open).
      entry_fill: next_1m_open
      
      # rr_take_profit: Risk-reward ratio for take profit (4.0 = 4:1).
      rr_take_profit: 4.0
      
      # stop_source: Stop loss source (bb_middle_signal_hour = BB middle from signal hour).
      stop_source: bb_middle_signal_hour
      
      # exit_on: List of exit conditions.
      exit_on:
        - stop_touch_bb_middle  # Exit when price touches BB middle
        - take_profit_rr        # Exit when TP target is hit
      
      # conflict_resolution: What to do if stop and TP hit in same candle (stop_first = exit at stop).
      conflict_resolution: stop_first
      
      # ignore_signals_while_in_trade: If true, ignore new signals when already in a position.
      ignore_signals_while_in_trade: true

  # ATR breakout: 24-hour crypto trading day breakout strategy
  #               Attempts one breakout per day, exits at EOD or stop loss.
  - id: atr_breakout
    type: atr_breakout
    enabled: false
    
    params:
      # atr_period: Number of 24-hour periods for ATR calculation.
      atr_period: 14
      
      # breakout_multiplier: Multiplier for breakout levels (k × ATR from previous day).
      #                       Example: 0.42 = breakout at prev_close ± 0.42 × ATR
      breakout_multiplier: 0.40
      
      # stop_multiplier: Multiplier for stop loss (k × ATR from previous day).
      #                   Example: 0.26 = stop at entry ± 0.26 × ATR
      stop_multiplier: 0.24
      
      # day_start_hour: Hour when trading day starts (13 = 13:00 UTC).
      #                 Day boundaries are calculated from this hour.
      day_start_hour: 13

  # Supertrend: Trend-following strategy using ATR-based Supertrend indicator
  #             Enters on trend changes, exits on trend reversals.
  - id: supertrend
    type: supertrend
    enabled: true 

    # signal_timeframe: Timeframe for Supertrend calculation (4h = 4-hour bars).
    signal_timeframe: 4h

    params:
      # atr_period: Number of periods for ATR calculation (default 10).
      atr_period: 12

      # multiplier: ATR multiplier for Supertrend bands (default 3.0).
      multiplier: 7
