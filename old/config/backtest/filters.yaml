# Backtest filter configuration (pre-entry).
#
# This file defines a filter pipeline that can be applied to signal timeframe data.
# Filters add columns to the DataFrame and check if trades are allowed.

version: 2

logic_mode: AND  # AND = all enabled filters must pass, OR = any filter passes

rules:
  # Supertrend trend confirmation filter
  # Only allows trades when filter direction matches trade direction
  supertrend:
    enabled: true
    params:
      atr_period: 12
      multiplier: 15.0


