# Crypto Symbols Configuration
# Easy to add new symbols here

symbols:
  ETHUSDT:
    symbol: ETHUSDT
    category: linear  # linear = USDT-margined perpetual futures
    description: Ethereum Perpetual Futures
    
  BTCUSDT:
    symbol: BTCUSDT
    category: linear
    description: Bitcoin Perpetual Futures

# Default symbol to use if not specified
default_symbol: ETHUSDT

# API Configuration
api:
  base_url: https://api.bybit.com
  endpoint: /v5/market/kline
  rate_limit_per_minute: 500  # Public API rate limit
  request_delay_seconds: 0.3  # Delay between requests to stay under limit

# Data Configuration
data:
  interval: 1  # 1-minute klines
  output_format: csv
  data_directory: data/raw/crypto
  # Date range for data download (YYYY-MM-DD format)
  # If null or not specified, defaults to 1 year ago to now
  start_date: 2025-12-15  # null = 1 year ago
  end_date: null    # null = now, or specify like "2024-12-31"



